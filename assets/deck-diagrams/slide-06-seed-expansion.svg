<svg viewBox="290.00 90.00 1010.00 814.00" width="1010.00" height="814.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s6-title s6-desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="s6-title">Search expands outward from strong candidates</title>
  <desc id="s6-desc">Three larger filled circles on the left labeled Strong candidate 1, 2, and 3. Thin lines radiate outward to seven smaller outlined circles on the right.</desc>

  <!--
    Geometry:
      Three seed circles on the left column, x = 420, evenly spaced vertically, radius 90.
        Seed 1: (420, 220)
        Seed 2: (420, 450)
        Seed 3: (420, 680)

      Seven outlined second-ring circles on the right, radius 40, arranged in a loose arc
      between xH950 and xH1300, vertical y spread from 150 to 750:
        N1: (980,  160)
        N2: (1160, 260)
        N3: (1310, 380)
        N4: (1100, 460)   <- central overlap candidate, receives edges from multiple seeds
        N5: (1310, 540)
        N6: (1160, 640)
        N7: (980,  760)

      Connections (chosen so central nodes have overlap from multiple seeds):
        Seed 1 -> N1, N2, N3, N4
        Seed 2 -> N3, N4, N5
        Seed 3 -> N4, N5, N6, N7
  -->

  <!--
    Second-ring layout revised for clean visual rhythm:
      nodes sit on TWO vertical columns:
        inner column x = 980   (4 nodes)
        outer column x = 1220  (4 nodes, offset vertically)
      y positions chosen so each column is evenly spaced and the two columns interleave.

    Final node centers (8 total):
      Inner column (x=980):  y = 180, 380, 560, 760
      Outer column (x=1220): y = 260, 460, 660

    Use 7 nodes total:
      (980, 180), (1220, 260), (980, 380), (1220, 460), (980, 560), (1220, 660), (980, 760)
  -->

  <!-- Connector lines (drawn first so they sit behind nodes) -->
  <g stroke="#0B0B0F" stroke-width="1" fill="none" opacity="0.85">
    <!-- Seed 1 (420, 220) connects to upper-left neighbors -->
    <line x1="420" y1="220" x2="980"  y2="180"/>
    <line x1="420" y1="220" x2="1220" y2="260"/>
    <line x1="420" y1="220" x2="980"  y2="380"/>
    <!-- Seed 2 (420, 450) connects to middle neighbors (includes shared nodes) -->
    <line x1="420" y1="450" x2="980"  y2="380"/>
    <line x1="420" y1="450" x2="1220" y2="460"/>
    <line x1="420" y1="450" x2="980"  y2="560"/>
    <!-- Seed 3 (420, 680) connects to lower neighbors -->
    <line x1="420" y1="680" x2="980"  y2="560"/>
    <line x1="420" y1="680" x2="1220" y2="660"/>
    <line x1="420" y1="680" x2="980"  y2="760"/>
  </g>

  <!-- Second-ring nodes (outlined, unlabeled) -->
  <g fill="#FAFAF7" stroke="#0B0B0F" stroke-width="1.5">
    <circle cx="980"  cy="180" r="40"/>
    <circle cx="1220" cy="260" r="40"/>
    <circle cx="980"  cy="380" r="40"/>
    <circle cx="1220" cy="460" r="40"/>
    <circle cx="980"  cy="560" r="40"/>
    <circle cx="1220" cy="660" r="40"/>
    <circle cx="980"  cy="760" r="40"/>
  </g>

  <!-- Seed nodes (filled accent, drawn on top) -->
  <g fill="#0F766E">
    <circle cx="420" cy="220" r="90"/>
    <circle cx="420" cy="450" r="90"/>
    <circle cx="420" cy="680" r="90"/>
  </g>

  <!-- Seed labels (inside seeds) -->
  <g fill="#FFFFFF" font-size="18" font-weight="600" text-anchor="middle">
    <text x="420" y="212">Strong</text>
    <text x="420" y="234">candidate 1</text>

    <text x="420" y="442">Strong</text>
    <text x="420" y="464">candidate 2</text>

    <text x="420" y="672">Strong</text>
    <text x="420" y="694">candidate 3</text>
  </g>

  <!-- Caption below the diagram -->
  <text x="800" y="860" text-anchor="middle" fill="#6B7280" font-size="22" font-weight="500" font-style="italic">
    Search expands outward from strong candidates.
  </text>
</svg>
