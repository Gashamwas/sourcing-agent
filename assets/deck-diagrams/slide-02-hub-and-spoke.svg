<svg viewBox="372.00 0.00 855.00 941.00" width="855.00" height="941.00" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="s2-title s2-desc" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="s2-title">Hiring Brief as the center of the system</title>
  <desc id="s2-desc">A hub-and-spoke diagram. A central node labeled Hiring Brief connects to six outer nodes: Search Strategy, Discovery and Review, Safe Execution, Run Records, Market Insight, Next Brief.</desc>

  <defs>
    <marker id="s2-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0B0B0F"/>
    </marker>
  </defs>

  <!--
    Geometry:
      hub center (800, 450), hub radius 118
      outer node centers at radius 320 around the hub, at clock positions 12, 2, 4, 6, 8, 10
      outer node radius 110
      line endpoints: start = hub_center + 118 * unit, end = outer_center - 110 * unit
      unit vectors (dx, dy) per clock position:
        12 clock -> ( 0.000, -1.000)
         2 clock -> ( 0.866, -0.500)
         4 clock -> ( 0.866,  0.500)
         6 clock -> ( 0.000,  1.000)
         8 clock -> (-0.866,  0.500)
        10 clock -> (-0.866, -0.500)
      outer centers:
        12 clock -> (800.00, 130.00)
         2 clock -> (1077.13, 290.00)
         4 clock -> (1077.13, 610.00)
         6 clock -> (800.00, 770.00)
         8 clock -> (522.87, 610.00)
        10 clock -> (522.87, 290.00)
  -->

  <!-- Spoke arrows from hub to each outer node -->
  <g stroke="#0B0B0F" stroke-width="1.75" fill="none" marker-end="url(#s2-arrow)">
    <line x1="800.00"  y1="332.00" x2="800.00"  y2="240.00"/>
    <line x1="902.19"  y1="391.00" x2="981.88"  y2="336.00"/>
    <line x1="902.19"  y1="509.00" x2="981.88"  y2="564.00"/>
    <line x1="800.00"  y1="568.00" x2="800.00"  y2="660.00"/>
    <line x1="697.81"  y1="509.00" x2="618.12"  y2="564.00"/>
    <line x1="697.81"  y1="391.00" x2="618.12"  y2="336.00"/>
  </g>

  <!-- Outer nodes -->
  <g fill="#FAFAF7" stroke="#0B0B0F" stroke-width="1.75">
    <circle cx="800.00"  cy="130.00" r="110"/>
    <circle cx="1077.13" cy="290.00" r="110"/>
    <circle cx="1077.13" cy="610.00" r="110"/>
    <circle cx="800.00"  cy="770.00" r="110"/>
    <circle cx="522.87"  cy="610.00" r="110"/>
    <circle cx="522.87"  cy="290.00" r="110"/>
  </g>

  <!-- Outer node labels (two lines where needed, centered visually) -->
  <g fill="#0B0B0F" font-size="22" font-weight="500" text-anchor="middle">
    <text x="800.00"  y="124">Search</text>
    <text x="800.00"  y="152">Strategy</text>

    <text x="1077.13" y="284">Discovery</text>
    <text x="1077.13" y="312">&amp; Review</text>

    <text x="1077.13" y="604">Safe</text>
    <text x="1077.13" y="632">Execution</text>

    <text x="800.00"  y="764">Run</text>
    <text x="800.00"  y="792">Records</text>

    <text x="522.87"  y="604">Market</text>
    <text x="522.87"  y="632">Insight</text>

    <text x="522.87"  y="298">Next Brief</text>
  </g>

  <!-- Hub node (drawn last so it sits above spoke line ends cleanly) -->
  <circle cx="800" cy="450" r="118" fill="#0F766E"/>
  <g fill="#FFFFFF" font-size="30" font-weight="700" text-anchor="middle">
    <text x="800" y="444">Hiring</text>
    <text x="800" y="480">Brief</text>
  </g>
</svg>
